# Netlify build. Security headers are generated into dist/_headers at build time
# (security-headers.ts) from VITE_SUPABASE_URL, which is set in the Netlify UI.
[build]
  # The key check scans the real bundle, built with the production key.
  command = "npm run build && node scripts/check-dist-keys.mjs dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A missing build file (an old chunk after a redeploy) is a real 404, not the app's HTML served
# as script. Files that exist are served first, so this only catches misses. Must stay above the
# fallback below.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
