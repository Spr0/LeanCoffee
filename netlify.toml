# Netlify build. Security headers are generated into dist/_headers at build time
# (security-headers.ts) from VITE_SUPABASE_URL, which is set in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
