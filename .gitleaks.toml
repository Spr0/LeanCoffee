# Gitleaks configuration: the default rules, plus one documented exception.
[extend]
useDefault = true

# Supabase publishable keys are public by design (they ship in every visitor's browser) and the
# keep-alive workflow needs one. Any sb_publishable_ key is allowed, so a rotation
# does not break the full-history scan; secret keys (sb_secret_) and JWTs still fail.
[[allowlists]]
description = "Supabase publishable keys (public by design)"
regexTarget = "match"
regexes = ['''sb_publishable_[A-Za-z0-9_-]{20,}''']
