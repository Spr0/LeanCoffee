name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile integrity enforced by npm ci)
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Netlify function file names are deployable
        run: '! ls netlify/functions | grep -vE "^[A-Za-z0-9_-]+\\.(m?[jt]s)$"'
      - name: Build (placeholder Supabase project; the real key is checked on Netlify)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build output contains no privileged Supabase keys
        run: node scripts/check-dist-keys.mjs dist
      - name: The key check catches a service-role JWT
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          # Build a fake (unsigned) token whose payload says role=service_role.
          node -e "const b=(o)=>Buffer.from(JSON.stringify(o)).toString('base64url');console.log('eyJ'+b({alg:'none'}).slice(3)+'.'+b({role:'service_role'})+'.sig')" > "$RUNNER_TEMP/canary/x.js"
          if node scripts/check-dist-keys.mjs "$RUNNER_TEMP/canary"; then echo "::error::key check missed a service_role JWT"; exit 1; fi

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --no-banner --redact -v .

  export:
    name: Export fidelity (Word and Excel via LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install LibreOffice (stand-in for Word and Excel)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui
      - name: Build sample files, round-trip them, and convert with LibreOffice
        run: EXPORT_SAMPLES=$PWD/test-results/exports npx vitest run src/lib/export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: export-samples
          path: test-results/exports
          retention-days: 14

  integration:
    name: Database tests and end-to-end (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, realtime, API)
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Apply migrations from scratch
        run: npx supabase db reset
      - name: pgTAP suite
        run: npx supabase test db
      - name: Database lint (plpgsql_check)
        run: |
          set +e
          npx supabase db lint --level warning --fail-on error > lint.txt 2>&1
          code=$?
          cat lint.txt
          # Surface findings as an annotation so they are readable without log access.
          if [ -s lint.txt ] && grep -q '"level"' lint.txt; then
            msg=$(head -c 6000 lint.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::warning title=supabase db lint::$msg"
          fi
          exit $code
      - name: Point the app at the local stack
        run: |
          eval "$(npx supabase status -o env)"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.local
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright, axe, realtime isolation)
        run: npm run test:e2e
      - name: Lighthouse accessibility (every session screen, light and dark)
        run: |
          npm ci --prefix tools/lighthouse --ignore-scripts
          npm audit --prefix tools/lighthouse --audit-level=high
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          set +e
          node scripts/lighthouse-a11y.mjs http://127.0.0.1:4173 tools/lighthouse > lighthouse.txt 2>&1
          code=$?
          cat lighthouse.txt
          msg=$(tail -c 3000 lighthouse.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=Lighthouse accessibility::$msg"
          exit $code
      - name: Upload screen captures for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: test-results/screens
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
